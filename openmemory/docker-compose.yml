services:
  mem0_store:
    image: qdrant/qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - mem0_storage:/qdrant/storage
  openmemory-mcp:
    image: mem0/openmemory-mcp
    build: api/
    environment:
      - USER
      - API_KEY
      - OPENMEMORY_API_TOKEN
      - DATABASE_URL=sqlite:////var/lib/openmemory/openmemory.db
    env_file:
      - api/.env
    depends_on:
      - mem0_store
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./api:/usr/src/openmemory
      - openmemory_db:/var/lib/openmemory
      - mem0_history:/root/.mem0
    # Single worker, NO --reload. SSE-based MCP keeps per-session state in-process,
    # so --reload (which restarts the worker whenever a file under ./api changes —
    # incl. code patches) silently drops every connected client's MCP session and
    # their next tool call fails with "-32602 request before initialization". Patch
    # mcp_server.py then `docker compose restart openmemory-mcp` to load changes.
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8765 --workers 1"
  openmemory-ui:
    build:
      context: ui/
      dockerfile: Dockerfile
    image: mem0/openmemory-ui:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8765}
      - NEXT_PUBLIC_USER_ID=${USER:-user}
      - OPENMEMORY_API_URL=http://openmemory-mcp:8765
      - OPENMEMORY_API_TOKEN

volumes:
  openmemory_db:
  mem0_storage:
  mem0_history:
