services:
  mem0_store:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - mem0_storage:/mem0/storage
  openmemory-mcp:
    image: mem0/openmemory-mcp
    build: api/
    environment:
      - USER
      - API_KEY
    env_file:
      - api/.env
    depends_on:
      - mem0_store
    ports:
      - "8765:8765"
    volumes:
      - ./api:/usr/src/openmemory
    # Single worker, NO --reload. SSE-based MCP keeps per-session state in-process,
    # so --reload (which restarts the worker whenever a file under ./api changes —
    # incl. code patches) silently drops every connected client's MCP session and
    # their next tool call fails with "-32602 request before initialization". Patch
    # mcp_server.py then `docker compose restart openmemory-mcp` to load changes.
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8765 --workers 1"
  openmemory-ui:
    build:
      context: ui/
      dockerfile: Dockerfile
    image: mem0/openmemory-ui:latest
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_USER_ID=${USER}

volumes:
  mem0_storage:
